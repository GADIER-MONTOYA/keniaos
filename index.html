<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENIA OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <audio id="reproductor-audio" src="kdekarma/Kenia Os - Belladona (SPOTISAVER).mp3"></audio>

    <aside class="barra-lateral">
        <button class="boton-menu" id="palanca-menu">
            <i class="fas fa-bars"></i>
        </button>
    </aside>

    <nav class="menu-desplegable" id="menu-navegacion">
        <a href="https://www.sonymusic.com.mx/artist/kenia-os/" target="_blank">¿QUIEN ES KENIA OS?</a>
        <a href="https://open.spotify.com/intl-es/artist/31VFEohvhOUKrtAONEBhMG/discography/all?edv=1"
            target="_blank">DISCOGRAFIA</a>
        <a href="https://kosbeauty.mx/" target="_blank">KOS BEAUTY</a>
        <a href="https://kosessence.com/?gad_source=1&gad_campaignid=23840147985&gbraid=0AAAABDnDhxq5dTXC-GDv2eDUu070GD4oW&gclid=Cj0KCQjwlerQBhDMARIsAB16H-VDfA1DNy5aI3vkz61YmX9Ie4L9kuXfaSK1D6BneaFhOhcbEaI8cHkaAphbEALw_wcB"
            target="_blank">KOS ESSENCE</a>
        <a href="https://www.instagram.com/keniaos/?hl=es-la" target="_blank">INSTAGRAM</a>
        <a href="https://www.tiktok.com/@keniaos?lang=es" target="_blank">TIK TOK</a>
    </nav>

    <div class="container">

        <main class="content-section">
            <header>
                <h1>KENIA OS</h1>
            </header>

            <div class="player-container">
                <div class="portada-album">
                    <img src="imagenes/VinilRojo.png" alt="Album Cover" id="imagen-portada">
                </div>


                <div id="titulo-cancion"
                    style="text-align: center; font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #fff;">
                </div>


                <div class="linea-tiempo">
                    <div class="contenedor-onda">
                        <span class="onda-bucle"></span>
                        <span class="onda-bucle"></span>
                    </div>
                </div>

                <div class="controles">
                    <button class="control-boton" id="boton-anterior"><i class="fas fa-backward"></i></button>
                    <button class="control-play" id="boton-reproducir"><i class="fas fa-pause"
                            id="icono-control"></i></button>
                    <button class="control-boton" id="boton-siguiente"><i class="fas fa-forward"></i></button>
                </div>
            </div>
        </main>

        <aside class="seccion-imagen">
            <img src="imagenes/KeniaOs.png" alt="Kenia Os">
        </aside>

    </div>

    <script src="script.js"></script>
</body>


</html>
